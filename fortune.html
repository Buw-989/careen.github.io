    <title>🔮 ดูดวงสายอาชีพ</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                "Noto Sans Thai",
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 217, 255, 0.25),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(0, 102, 255, 0.30),
                    transparent 40%
                ),

                linear-gradient(
                    135deg,
                    #03152f,
                    #063d72,
                    #071d46
                );

        }


        header {

            padding: 20px;

            text-align: center;

            border-bottom:
                1px solid
                rgba(0, 220, 255, .25);

            background:
                rgba(0, 20, 50, .65);

            backdrop-filter:
                blur(15px);

        }


        header h1 {

            margin: 0;

            color: #75efff;

            text-shadow:
                0 0 15px
                rgba(0, 225, 255, .7);

        }


        header p {

            margin:
                8px 0 0;

            color: #9bc9df;

            font-size: 14px;

        }


        .back-button {

            position: absolute;

            left: 20px;

            top: 20px;

            padding:
                9px 16px;

            border-radius: 10px;

            border:
                1px solid
                rgba(0, 220, 255, .4);

            background:
                rgba(0, 120, 255, .15);

            color: white;

            cursor: pointer;

        }


        .back-button:hover {

            background:
                rgba(0, 200, 255, .25);

        }


        .container {

            width: 90%;

            max-width: 850px;

            margin:
                50px auto;

            text-align: center;

        }


        .fortune-card {

            padding: 40px 25px;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(4, 52, 100, .85),
                    rgba(2, 20, 50, .9)
                );

            border:
                1px solid
                rgba(0, 220, 255, .3);

            box-shadow:
                0 0 40px
                rgba(0, 200, 255, .15);

            backdrop-filter:
                blur(15px);

        }


        .orb {

            width: 130px;

            height: 130px;

            margin:
                0 auto 25px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 55px;

            background:
                radial-gradient(
                    circle,
                    #00eaff,
                    #0077ff 50%,
                    #031b50
                );

            box-shadow:
                0 0 25px #00d9ff,
                0 0 70px
                rgba(0, 217, 255, .4);

            animation:
                floating 3s infinite ease-in-out;

        }


        @keyframes floating {

            0%,100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-10px);

            }

        }


        .random-button {

            margin-top: 20px;

            padding:
                15px 30px;

            border: none;

            border-radius: 12px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #0066ff,
                    #00d9ff
                );

            box-shadow:
                0 0 25px
                rgba(0, 217, 255, .35);

            transition: .2s;

        }


        .random-button:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 0 35px
                rgba(0, 217, 255, .6);

        }


        #result {

            margin-top: 30px;

        }


        .career-result {

            overflow: hidden;

            border-radius: 20px;

            background:
                rgba(0, 140, 255, .10);

            border:
                1px solid
                rgba(0, 220, 255, .35);

            animation:
                appear .5s ease;

        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(15px)
                    scale(.97);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* รูปอาชีพ */

        .career-image {

            width: 100%;

            height: 280px;

            object-fit: cover;

            display: block;

            background:
                linear-gradient(
                    135deg,
                    #0066ff,
                    #00d9ff
                );

        }


        .career-content {

            padding: 25px;

        }


        .career-icon {

            font-size: 45px;

            margin-bottom: 5px;

        }


        .career-name {

            margin:
                5px 0 10px;

            font-size: 28px;

            color: #72efff;

            text-shadow:
                0 0 15px
                rgba(0, 220, 255, .5);

        }


        .career-number {

            display: inline-block;

            margin-bottom: 12px;

            padding:
                5px 12px;

            border-radius: 20px;

            background:
                rgba(0, 217, 255, .12);

            border:
                1px solid
                rgba(0, 217, 255, .25);

            color: #78dff5;

            font-size: 11px;

        }


        .career-description {

            color: #a8d4e8;

            line-height: 1.7;

            font-size: 14px;

        }


        .random-again {

            margin-top: 20px;

            padding:
                10px 20px;

            border-radius: 10px;

            border:
                1px solid
                #00d9ff;

            background:
                transparent;

            color: #72efff;

            cursor: pointer;

            font-weight: bold;

        }


        .random-again:hover {

            background:
                rgba(0, 217, 255, .15);

        }


        @media(max-width:600px) {

            .back-button {

                position: static;

                margin-bottom: 10px;

            }


            header {

                padding-top: 15px;

            }


            .container {

                margin-top: 30px;

            }


            .career-image {

                height: 220px;

            }


            .career-name {

                font-size: 22px;

            }

        }

    </style>

</head>

/* =====================================================
   RANDOM CAREER
===================================================== */

let lastIndex = -1;


function randomCareer() {


    let randomIndex;


    /* ไม่ให้สุ่มอาชีพเดิมซ้ำทันที */

    do {

        randomIndex =
            Math.floor(
                Math.random() *
                careers.length
            );

    }

    while (
        randomIndex === lastIndex &&
        careers.length > 1
    );


    lastIndex =
        randomIndex;


    const career =
        careers[randomIndex];


    document.getElementById(
        "result"
    ).innerHTML = `

        <div class="career-result">

            <img
                class="career-image"
                src="${career.image}"
                alt="${career.name}"
                onerror="this.style.display='none';"
            >


            <div class="career-content">

                <div class="career-icon">

                    ${career.icon}

                </div>


                <div class="career-number">

                    อาชีพที่ ${randomIndex + 1}
                    จาก ${careers.length} อาชีพ

                </div>


                <div class="career-name">

                    ${career.name}

                </div>


                <div class="career-description">

                    ${career.description}

                </div>


                <button
                    class="random-again"
                    onclick="randomCareer()">

                    🔄 สุ่มอาชีพใหม่

                </button>

            </div>

        </div>

    `;

}
